[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "picopike"
version = "0.0.0"
description = "Tiny classifier, outsized sting."
authors = [{ name = "Atharva Vaidya", email = "hello@atharvav.com" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/picopike"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["picopike"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["picopike"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
    "integration: tests that touch models, network or disk, or measure timing on the local machine",
]
